name: Build Release

on:
  push:
    branches: [ Main ]
    paths-ignore:
      - '**.md'
      - '**/ISSUE_TEMPLATE/**'
      - '**.json'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Determine release version
      id: ver
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $content = Get-Content -Path "XAU/XAU.csproj" -Raw
        if (-not ($content -match '<Version>([^<]+)</Version>')) {
          Write-Host "Version tag not found in XAU.csproj. Skipping release."
          echo "should_release=false" >> $env:GITHUB_OUTPUT
          exit 0
        }
        $version = $Matches[1].Trim()
        Write-Host "Version = $version"
        echo "version=$version" >> $env:GITHUB_OUTPUT

        if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "0.0.0" -or $version.Contains("DEV")) {
          Write-Host "Placeholder/dev version ($version). Skipping release."
          echo "should_release=false" >> $env:GITHUB_OUTPUT
          exit 0
        }
        gh release view "$version" --repo "$env:GITHUB_REPOSITORY" 2>$null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release $version already exists. Skipping."
          echo "should_release=false" >> $env:GITHUB_OUTPUT
          exit 0
        }
        Write-Host "Will create standard release $version."
        echo "should_release=true" >> $env:GITHUB_OUTPUT
        exit 0

    - name: Restore dependencies
      if: steps.ver.outputs.should_release == 'true'
      run: dotnet restore /p:EnableWindowsTargeting=true

    - name: Build
      if: steps.ver.outputs.should_release == 'true'
      run: dotnet publish XAU.sln -c Release -r win-x64 --self-contained false /p:PublishSingleFile=false /p:EnableWindowsTargeting=true -o ./publish

    - name: Stage executable & release zip
      if: steps.ver.outputs.should_release == 'true'
      shell: pwsh
      run: |
        $version = "${{ steps.ver.outputs.version }}"
        $zipPath = "${{ github.workspace }}/AchievementForge-v${version}-win-x64.zip"
        Compress-Archive -Path "./publish/*" -DestinationPath $zipPath -Force
        Copy-Item -Path "./publish/AF.exe" -Destination "${{ github.workspace }}/AF.exe" -Force

    - name: Create standard release
      if: steps.ver.outputs.should_release == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "${{ steps.ver.outputs.version }}"

        # Find when the previous standard (non-prerelease) release was published.
        $since = ""
        $prevJson = gh release list --repo "$env:GITHUB_REPOSITORY" --exclude-drafts --exclude-prereleases --json publishedAt --limit 1
        if ($prevJson) {
          $parsed = $prevJson | ConvertFrom-Json
          if ($parsed) { $since = $parsed[0].publishedAt }
        }
        Write-Host "Previous standard release publishedAt: '$since'"

        if ($since) {
          $commits = git log --since="$since" --no-merges --pretty=format:"- %s"
        } else {
          Write-Host "No previous standard release found; using full history."
          $commits = git log --no-merges --max-count=200 --pretty=format:"- %s"
        }
        if (-not $commits) { $commits = @("- AchievementForge $version release") }
        $body = $commits -join "`n"
        Set-Content -Path "release-notes.txt" -Value $body -Encoding utf8

        Write-Host "Release notes:`n$body"
        gh release create "$version" "${{ github.workspace }}/AchievementForge-v${version}-win-x64.zip" "${{ github.workspace }}/AF.exe" `
          --repo "$env:GITHUB_REPOSITORY" `
          --title "AchievementForge v$version" `
          --notes-file "release-notes.txt" `
          --latest
